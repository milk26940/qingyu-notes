[package]
name = "qingyu-notes"
version = "0.2.0"
license = "MIT"
description = "轻羽本地优先笔记与知识库"
authors = ["QingYu"]
edition = "2021"

[lib]
name = "qingyu_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
notify = "8"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
pdf-extract = "0.9"
csv = "1"
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "21"
percent-encoding = "2"
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { version = "=0.44.0", default-features = false, features = ["rustls"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory"] }
